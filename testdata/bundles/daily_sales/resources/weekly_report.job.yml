resources:
  jobs:
    weekly_report:
      name: weekly_report
      trigger:
        file_arrival:
          url: s3://example-sales-landing/weekly/
          min_time_between_triggers_seconds: 60
      tasks:
        - task_key: report
          spark_python_task:
            python_file: ../src/weekly/report.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
